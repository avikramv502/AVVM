<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{ page.title | default: page.author_name | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: page.bio | default: site.description }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: page.author_name | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: page.bio | default: site.description }}">
  {% assign share_img = page.avatar | default: site.data.links.avatar %}
  {% if share_img %}
  <meta property="og:image" content="{{ share_img | absolute_url }}">
  <meta name="twitter:image" content="{{ share_img | absolute_url }}">
  {% endif %}

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page.title | default: page.author_name | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: page.bio | default: site.description }}">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon">
</head>
<body>
  {{ content }}
</body>
</html>
